version: 2

models:
  - name: dim_customers
    description: Customer dimension — Olist batch customers. SCD2-ready.
    columns:
      - name: customer_key
        description: Surrogate key for customer dimension
        tests:
          - not_null
          - unique
      - name: customer_id
        description: Natural key from source systems
        tests:
          - not_null
      - name: is_current
        tests:
          - not_null
          - accepted_values:
              values: [true, false]
      - name: source
        tests:
          - not_null
          - accepted_values:
              values: ['olist_batch']
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          min_value: 90000

  - name: dim_products
    description: Product dimension — Olist batch products. SCD2-ready.
    columns:
      - name: product_key
        description: Surrogate key for product dimension
        tests:
          - not_null
          - unique
      - name: product_id
        description: Natural key from source systems
        tests:
          - not_null
      - name: is_current
        tests:
          - not_null
      - name: source
        tests:
          - not_null
          - accepted_values:
              values: ['olist_batch']

  - name: dim_sellers
    description: Seller dimension — Olist batch only. SCD2-ready.
    columns:
      - name: seller_key
        description: Surrogate key for seller dimension
        tests:
          - not_null
          - unique
      - name: seller_id
        description: Natural key from source
        tests:
          - not_null
          - unique

  - name: dim_dates
    description: Date dimension — generated spine 2016-2019.
    columns:
      - name: date_key
        tests:
          - not_null
          - unique
      - name: full_date
        tests:
          - not_null
          - unique
      - name: year
        tests:
          - not_null
      - name: month
        tests:
          - not_null

  - name: dim_geography
    description: Geography dimension — enriched via ViaCEP. One row per CEP prefix.
    columns:
      - name: geography_key
        tests:
          - not_null
          - unique
      - name: cep_prefix
        tests:
          - not_null
          - unique
      - name: state_code
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ['AC','AL','AM','AP','BA','CE','DF','ES','GO','MA',
                          'MG','MS','MT','PA','PB','PE','PI','PR','RJ','RN',
                          'RO','RR','RS','SC','SE','SP','TO']
      - name: region
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_in_set:
              value_set: ['Norte', 'Nordeste', 'Centro-Oeste', 'Sudeste', 'Sul']

  - name: fact_order_items
    description: Fact table — one row per order line item. Incremental.
    columns:
      - name: order_item_key
        description: Surrogate key (md5 of order_id + order_item_id)
        tests:
          - not_null
          - unique
      - name: customer_key
        description: FK to dim_customers
        tests:
          - not_null
          - relationships:
              to: ref('dim_customers')
              field: customer_key
              config:
                where: "customer_key != -1"
      - name: product_key
        description: FK to dim_products
        tests:
          - not_null
          - relationships:
              to: ref('dim_products')
              field: product_key
              config:
                where: "product_key != -1"
      - name: seller_key
        description: FK to dim_sellers
        tests:
          - not_null
          - relationships:
              to: ref('dim_sellers')
              field: seller_key
              config:
                where: "seller_key != -1"
      - name: order_date_key
        description: FK to dim_dates
        tests:
          - not_null
          - relationships:
              to: ref('dim_dates')
              field: date_key
              config:
                where: "order_date_key != -1"
      - name: price
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 50000
      - name: freight_value
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 5000
      - name: total_amount
        tests:
          - not_null
      - name: order_id
        tests:
          - not_null
    tests:
      - dbt_expectations.expect_table_row_count_to_be_between:
          min_value: 100000

  - name: fact_order_payments
    description: Fact table — one row per payment entry. Incremental.
    columns:
      - name: payment_key
        description: Surrogate key (md5 of order_id + payment_sequential)
        tests:
          - not_null
          - unique
      - name: order_date_key
        description: FK to dim_dates
        tests:
          - not_null
          - relationships:
              to: ref('dim_dates')
              field: date_key
              config:
                where: "order_date_key != -1"
      - name: payment_value
        tests:
          - not_null
          - dbt_expectations.expect_column_values_to_be_between:
              min_value: 0
              max_value: 100000
      - name: payment_type
        tests:
          - not_null
          - accepted_values:
              values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined', 'unknown']
      - name: order_id
        tests:
          - not_null
