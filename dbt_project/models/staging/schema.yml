version: 2

models:
  # --- Batch staging models ---
  - name: stg_orders_batch
    description: Cleaned and deduplicated Olist orders
    columns:
      - name: order_id
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null]
      - name: order_status
        tests:
          - accepted_values:
              values: ['delivered', 'shipped', 'canceled', 'unavailable',
                       'invoiced', 'processing', 'created', 'approved', 'unknown']

  - name: stg_order_items_batch
    description: Cleaned order line items
    columns:
      - name: order_id
        tests: [not_null]
      - name: product_id
        tests: [not_null]
      - name: price
        tests: [not_null]

  - name: stg_customers_batch
    description: Cleaned Olist customers
    columns:
      - name: customer_id
        tests: [not_null, unique]
      - name: customer_unique_id
        tests: [not_null]

  - name: stg_products_batch
    description: Cleaned products with English category names
    columns:
      - name: product_id
        tests: [not_null, unique]

  - name: stg_sellers_batch
    description: Cleaned Olist sellers
    columns:
      - name: seller_id
        tests: [not_null, unique]

  - name: stg_payments_batch
    description: Cleaned order payments
    columns:
      - name: order_id
        tests: [not_null]
      - name: payment_type
        tests:
          - accepted_values:
              values: ['credit_card', 'boleto', 'voucher', 'debit_card', 'not_defined', 'unknown']

  - name: stg_reviews_batch
    description: Cleaned order reviews
    columns:
      - name: review_id
        tests: [not_null, unique]
      - name: review_score
        tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5, 0]

  # --- Enrichment staging models ---
  - name: stg_cep_enrichment
    description: ViaCEP geographic enrichment (valid CEPs only)
    columns:
      - name: cep_prefix
        tests: [not_null, unique]
      - name: state_code
        tests: [not_null]
      - name: city
        tests: [not_null]

  - name: stg_fx_rates
    description: BRL exchange rates (USD, EUR)
    columns:
      - name: base_currency
        tests: [not_null]
      - name: target_currency
        tests: [not_null]
      - name: rate
        tests: [not_null]
