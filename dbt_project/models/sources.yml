version: 2

sources:
  - name: raw
    schema: raw
    freshness:
      warn_after: {count: 36, period: hour}
      error_after: {count: 72, period: hour}
    loaded_at_field: "_loaded_at"
    tables:
      - name: orders
        identifier: orders
      - name: order_items
        identifier: order_items
      - name: customers
        identifier: customers
      - name: products
        identifier: products
      - name: sellers
        identifier: sellers
      - name: order_payments
        identifier: order_payments
      - name: order_reviews
        identifier: order_reviews
      - name: geolocation
        identifier: geolocation
        loaded_at_field: "_loaded_at"
        freshness: null  # geolocation is static, skip freshness
      - name: product_category_translation
        identifier: product_category_translation
        loaded_at_field: "_loaded_at"
        freshness: null  # translation table is static, skip freshness
      - name: cep_enrichment
        identifier: cep_enrichment
        description: ViaCEP geographic enrichment (top 1000 CEPs)
      - name: fx_rates
        identifier: fx_rates
        description: BRL exchange rates (USD, EUR)
