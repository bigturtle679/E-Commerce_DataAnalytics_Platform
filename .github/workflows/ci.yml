# ─── Meridian — CI Pipeline ───────────────────────────────────
# Validates backend, frontend, Docker builds on every push/PR.
# Integration tests run separately with a real PostgreSQL instance.
#
# Local equivalent: make ci

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ── Backend Validation ────────────────────────────────────────
jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff + black)
        run: make lint

      - name: Unit tests
        run: make test-unit

  # ── Frontend Validation ───────────────────────────────────────
  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Validate frontend
        run: make frontend-check

  # ── Docker Build Validation ────────────────────────────────────
  docker:
    name: Docker (build validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create CI environment file
        run: cp .env.example .env.docker

      - name: Validate compose config
        run: docker compose --env-file .env.docker config --quiet

      - name: Build API image
        run: docker build -f Dockerfile.api -t meridian-api-ci .

      - name: Build frontend image
        run: docker build -f Dockerfile.frontend -t meridian-frontend-ci .

  # ── Integration Tests (optional, with real PostgreSQL) ────────
  integration:
    name: Integration (PostgreSQL)
    runs-on: ubuntu-latest
    needs: [backend]  # Only run if unit tests pass
    if: github.event_name == 'push'  # Skip on PRs to keep CI fast

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: ecommerce
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: ecommerce
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ci_test_password
      DATASET_PATH: ./dataset
      FAKESTORE_API_BASE_URL: https://fakestoreapi.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run integration tests
        run: python -m pytest tests/test_integration.py -v -m integration
